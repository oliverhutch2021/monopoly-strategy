[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monopoly-meta"
version = "0.3.0"
description = "Finding the Monopoly meta: exact Markov maths, full-rules simulation and game-state valuation"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "flake8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monopoly_meta = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
